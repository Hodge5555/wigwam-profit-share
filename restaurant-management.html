<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070707">
<title>WigWam · Restaurant Management</title>
<style>
:root{color-scheme:dark;--black:#070707;--gold:#ffd000;--white:#f8f5e8;--muted:#b8b3a4;--line:#51420d}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0;background:#070707;color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:radial-gradient(ellipse at 50% -15%,rgba(255,208,0,.14),transparent 46%),#070707}
header{background:rgba(4,4,4,.97);border-bottom:1px solid #776000;box-shadow:0 8px 30px #0008}
.head{max-width:1180px;margin:auto;padding:13px 22px;min-height:92px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{width:96px;height:68px;object-fit:contain}
.brand-copy strong{display:block;color:var(--gold);font-weight:1000;font-size:clamp(20px,3vw,28px);letter-spacing:-.05em}
.brand-copy small{color:#d9cda0;font-size:9px;font-weight:850;letter-spacing:.17em}
.nav{display:flex;gap:9px;flex-wrap:wrap}
button,.btn{border:1px solid #67530c;border-radius:10px;background:#1c1c1c;color:var(--white);font-weight:850;padding:10px 14px;text-decoration:none;cursor:pointer;font-size:13px}
main{max-width:1180px;margin:34px auto 65px;padding:0 22px}
.kicker{color:var(--gold);font-size:10px;font-weight:950;letter-spacing:.2em}
h1{font-size:clamp(28px,4vw,42px);line-height:1.05;letter-spacing:-.05em;margin:7px 0;color:#fff}
#accessStatus{margin-top:18px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:#14130e;color:var(--muted)}
#accessStatus.error{border-color:#74312b;background:#211210;color:#ffaaa2}
.hidden{display:none!important}
@media(max-width:700px){.head{padding:10px 14px}.brand{gap:9px}.brand img{width:75px;height:56px}main{margin:25px auto 45px;padding:0 14px}}
</style>
</head>
<body>
<header><div class="head">
  <div class="brand">
    <img src="./assets/wigwam-logo.webp" alt="WigWam logo" width="96" height="68">
    <div class="brand-copy"><strong>WIGWAM</strong><small>FRESH OFF THE GRILL!</small></div>
  </div>
  <nav class="nav" aria-label="Page navigation">
    <a class="btn" href="./home.html">← Team hub</a>
    <button id="signOut" type="button">Sign out</button>
  </nav>
</div></header>
<main>
  <span class="kicker">MANAGEMENT ACCESS ONLY</span>
  <h1>Restaurant Management</h1>
  <div id="accessStatus" role="status" aria-live="polite">Verifying Management access…</div>
</main>
<script>
(() => {
  "use strict";
  const API = "https://mztgimetelvfsctqytqj.supabase.co/functions/v1/wigwam-catering";
  const PUBLIC_KEY = "sb_publishable_C_WY9FIK32q25OD3NYoKhQ_WPXV8SbU";
  const TOKEN_KEY = "wigwamCateringAccessToken";
  const EXPIRY_KEY = "wigwamCateringAccessExpiry";
  const USER_KEY = "wigwamCateringUser";
  const $ = id => document.getElementById(id);

  function redirectToSignIn() {
    sessionStorage.removeItem(TOKEN_KEY);
    sessionStorage.removeItem(EXPIRY_KEY);
    sessionStorage.removeItem(USER_KEY);
    window.location.replace("./catering.html");
  }

  async function verifyManagementAccess() {
    const token = sessionStorage.getItem(TOKEN_KEY) || "";
    const expiry = Number(sessionStorage.getItem(EXPIRY_KEY) || "0");
    if (!token || expiry <= Date.now()) {
      redirectToSignIn();
      return;
    }

    try {
      const response = await fetch(API, {
        method:"POST",
        headers:{"Content-Type":"application/json",apikey:PUBLIC_KEY},
        body:JSON.stringify({action:"session",access_token:token}),
        cache:"no-store"
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.user) throw new Error(result.error || "Your session could not be verified.");
      if (!result.user.isManagement) {
        window.location.replace("./home.html");
        return;
      }
      sessionStorage.setItem(USER_KEY,JSON.stringify(result.user));
      $("accessStatus").classList.add("hidden");
    } catch (error) {
      $("accessStatus").textContent = error.message || "Access could not be verified.";
      $("accessStatus").classList.add("error");
    }
  }

  $("signOut").addEventListener("click",redirectToSignIn);
  verifyManagementAccess();
})();
</script>
</body>
</html>
