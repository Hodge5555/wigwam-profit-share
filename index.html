<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WigWam Profit Share</title>
<style>body{font:16px system-ui,sans-serif;margin:0;padding:32px;background:#f6f2ee;color:#34251b}main{max-width:640px;margin:10vh auto;background:#fff;padding:28px;border:1px solid #f0d4ba;border-radius:16px}h1{color:#9e4e12}p{line-height:1.5}</style>
</head>
<body>
<main><h1>WigWam Profit Share</h1><p id="state">Loading the calculator…</p></main>
<script>
(async()=>{
 const state=document.getElementById("state");
 try{
  const parts=await Promise.all(Array.from({length:16},(_,i)=>{
   const name="payload-"+String(i+1).padStart(2,"0")+".txt";
   return fetch(name).then(r=>{if(!r.ok)throw new Error("Could not load "+name);return r.text()});
  }));
  const binary=atob(parts.join(""));
  const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  if(!("DecompressionStream" in window))throw new Error("This browser does not support gzip decoding.");
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  const html=await new Response(stream).text();
  const enhanced=html.replace("</body>",'<script src="ui-customization.js"><\/script></body>'); if(enhanced===html) throw new Error("Could not attach the employee search controls."); document.open();document.write(enhanced);document.close();
 }catch(error){
  state.textContent="The calculator could not load: "+error.message+" Please refresh the page or contact the site owner.";
 }
})();
</script>
</body>
</html>
