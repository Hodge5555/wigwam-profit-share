<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WigWam Profit Share Calculator</title>
<meta name="application-name" content="WigWam Profit Share">
<meta name="description" content="WigWam team profit-share calculator with Discord posting and payment tracking.">
<meta property="og:site_name" content="WigWam Profit Share">
<meta property="og:title" content="WigWam Profit Share Calculator">
<meta property="og:description" content="Calculate team profit shares, post to Discord and track payments.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="WigWam Profit Share Calculator">
<meta name="twitter:description" content="Calculate team profit shares, post to Discord and track payments.">
<style>body{font:16px system-ui,sans-serif;margin:0;padding:32px;background:#f6f2ee;color:#34251b}main{max-width:640px;margin:10vh auto;background:#fff;padding:28px;border:1px solid #f0d4ba;border-radius:16px}h1{color:#9e4e12}p{line-height:1.5}</style>
</head>
<body>
<main><h1>WigWam Profit Share</h1><p id="state">Loading the calculator…</p></main>
<script>
(async()=>{
 const state=document.getElementById("state");
 try{
  const parts=await Promise.all(Array.from({length:8},(_,i)=>{
   const name="payload-"+String(i+1).padStart(2,"0")+".txt";
   return fetch(name).then(r=>{if(!r.ok)throw new Error("Could not load "+name);return r.text()});
  }));
  const binary=atob(parts.join(""));
  const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  if(!("DecompressionStream" in window))throw new Error("This browser does not support gzip decoding.");
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  const html=await new Response(stream).text();
  const paymentPanel = `
<section class="card full" id="paymentPanel">
  <h2>Payment tracking</h2>
  <p class="notice">After a profit share is posted, mark each person from that posted list as paid. Every change updates the existing Discord embed in place. This tracks the latest posted profit share.</p>
  <div class="actions"><button class="secondary" id="loadPayments">Load latest payment list</button><button class="secondary" id="syncDiscordEmployees">Sync Discord Employees</button></div>
  <div id="paymentStatus" class="status">Post a profit share first, then load its payment list. Use the private posting code above.</div>
  <div id="paymentList" class="payments"></div>
</section>`;
  const cateringPanel = `
<section class="card full" id="cateringPanel">
  <h2>Catering orders</h2>
  <p class="notice">Customers can place catering requests. Employees can review and manage received orders using their Discord server role.</p>
  <div class="actions"><a href="./catering.html" style="display:inline-block;padding:11px 16px;border-radius:10px;background:#9e4e12;color:#fff;font-weight:700;text-decoration:none">Open catering orders</a></div>
</section>`;
  const enhanced = html.replace("</main>", paymentPanel + cateringPanel + "</main>")
    .replace('$("postCode").value="";', '// The posting code stays in this page session for payment updates.');
  if (enhanced === html) throw new Error("Could not add the payment tracker to the calculator.");
  document.open();document.write(enhanced);document.close();
  const tracker = document.createElement("script");
  tracker.src = "./payment-tracker.js?v=employee-role-sync-2";
  document.body.appendChild(tracker);
 }catch(error){
  state.textContent="The calculator could not load: "+error.message+" Please refresh the page or contact the site owner.";
 }
})();
</script>
</body>
</html>
